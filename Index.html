<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; margin: 0; padding: 15px; }
    h2 { text-align: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { background: #1e1e1e; border-radius: 10px; padding: 10px; text-align: center; }
    .card img { width: 100%; border-radius: 8px; }
    .lock-btn { background: #e50914; color: white; border: none; padding: 8px 12px; margin-top: 8px; border-radius: 5px; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <h2>Pro Course Videos</h2>
  
  <div class="grid">
    <div class="card">
      <img src="https://via.placeholder.com/150" alt="Thumbnail">
      <p>Class 1: Intro</p>
      <button class="lock-btn" onclick="watchAd()">🔒 Watch Ad (0/2)</button>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/150" alt="Thumbnail">
      <p>Class 2: Setup</p>
      <button class="lock-btn" onclick="watchAd()">🔒 Watch Ad (0/2)</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function watchAd() {
      alert("Ad dekhano hocche... (Ad Network set korar por ad show korbe)");
    }
  </script>
</body>
</html>
