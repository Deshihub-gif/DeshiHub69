<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeshiHub69 - Course Hub</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; margin: 0; padding: 15px; }
    h2 { text-align: center; margin-bottom: 20px; color: #f1f1f1; }
    
    .card { background: #1e1e1e; border-radius: 12px; padding: 15px; border: 1px solid #333; margin-bottom: 20px; }
    .card img.thumb { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
    .card h3 { margin: 10px 0 5px 0; font-size: 18px; }
    
    .btn { background: #e50914; color: white; border: none; padding: 12px; margin-top: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold; }
    
    /* Inside Content Section (Initially Hidden) */
    .unlocked-content { display: none; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; }
    
    .video-item { background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .video-item a { color: #fff; text-decoration: none; font-weight: bold; background: #28a745; padding: 6px 12px; border-radius: 4px; font-size: 13px; }
    
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .gallery img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; }
    
    .section-title { font-size: 13px; color: #aaa; margin: 10px 0 5px 0; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Pro Course Videos</h2>

  <!-- CARD 1: VIDEO 1 BUNDLE -->
  <div class="card">
    <img src="https://picsum.photos/400/200?random=1" class="thumb" alt="Thumbnail">
    <h3>Video 1: Course Part 1 Bundle</h3>
    
    <button id="btn-1" class="btn" onclick="watchAd('1')">
      🔒 Watch Ad to Unlock (0/2)
    </button>

    <!-- Content inside Video 1 -->
    <div id="content-1" class="unlocked-content">
      <div class="section-title">📺 PART 1 VIDEOS:</div>
      <div class="video-item">
        <span>🎬 Video 1.1 Intro</span>
        <a href="javascript:void(0)" onclick="openLink('https://youtube.com/shorts/6zUc-AM98fs?si=31wtPV9Mx5xBVq0w')">Watch</a>
      </div>
      <div class="video-item">
        <span>🎬 Video 1.2 Main Class</span>
        <a href="javascript:void(0)" onclick="openLink('https://youtube.com/shorts/EszOzkyh6wc?si=uoMQHFm-eOCj02-q')">Watch</a>
      </div>

      <div class="section-title">📸 PART 1 IMAGES:</div>
      <div class="gallery">
        <img src="https://picsum.photos/200/200?random=10" alt="Pic 1">
        <img src="https://picsum.photos/200/200?random=11" alt="Pic 2">
      </div>
    </div>
  </div>


  <!-- CARD 2: VIDEO 2 BUNDLE -->
  <div class="card">
    <img src="https://picsum.photos/400/200?random=2" class="thumb" alt="Thumbnail">
    <h3>Video 2: Course Part 2 Bundle</h3>
    
    <button id="btn-2" class="btn" onclick="watchAd('2')">
      🔒 Watch Ad to Unlock (0/2)
    </button>

    <!-- Content inside Video 2 -->
    <div id="content-2" class="unlocked-content">
      <div class="section-title">📺 PART 2 VIDEOS:</div>
      <div class="video-item">
        <span>🎬 Video 2.1 Advanced Setup</span>
        <a href="javascript:void(0)" onclick="openLink('https://t.me/your_channel/3')">Watch</a>
      </div>
      <div class="video-item">
        <span>🎬 Video 2.2 Final Guide</span>
        <a href="javascript:void(0)" onclick="openLink('https://t.me/your_channel/4')">Watch</a>
      </div>

      <div class="section-title">📸 PART 2 IMAGES:</div>
      <div class="gallery">
        <img src="https://picsum.photos/200/200?random=12" alt="Pic 3">
        <img src="https://picsum.photos/200/200?random=13" alt="Pic 4">
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // EKHANE APNAR NOTUN ADSGRAM BLOCK ID-TI QUOTE-ER BHETOR BOSHABEN
    const CURRENT_BLOCK_ID = "49581"; 

    let AdController = null;
    if (window.Adsgram && CURRENT_BLOCK_ID) {
      AdController = window.Adsgram.init({ blockId: CURRENT_BLOCK_ID });
    }

    const adProgress = {
      '1': 0,
      '2': 0
    };

    const REQUIRED_ADS = 2;

    function watchAd(cardId) {
      if (adProgress[cardId] >= REQUIRED_ADS) return;

      if (!AdController) {
        alert("49581");
        return;
      }

      AdController.show().then((result) => {
        adProgress[cardId]++;
        const btn = document.getElementById(`btn-${cardId}`);

        if (adProgress[cardId] >= REQUIRED_ADS) {
          btn.style.display = 'none';
          document.getElementById(`content-${cardId}`).style.display = 'block';
        } else {
          btn.innerText = `🔒 Watch Ad (${adProgress[cardId]}/${REQUIRED_ADS})`;
        }
      }).catch((result) => {
        alert("অ্যাড দেখা কমপ্লিট হয়নি! ভিডিও আনলক করতে অ্যাডটি পুরো দেখুন");
      });
    }

    function openLink(url) {
      tg.openLink(url);
    }
  </script>
</body>
</html>
