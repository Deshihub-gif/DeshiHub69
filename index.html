<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeshiHub69 - Course Hub</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f1015; color: #ffffff; padding: 15px; }
    
    /* Header Section */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: bold; color: #8a5cf6; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #2a2d3d; }
    
    /* Search Bar */
    .search-box { background: #1a1c24; border-radius: 12px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border: 1px solid #282b38; }
    .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 14px; }
    .search-box input::placeholder { color: #5c6275; }

    /* Categories Pills */
    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: #1a1c24; border: 1px solid #282b38; color: #8e94a5; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: #6c5ce7; color: white; border-color: #6c5ce7; }

    .section-label { font-size: 14px; font-weight: bold; color: #a2a8ba; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    /* 2-Column Video Grid */
    .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    .video-card { background: #181a20; border-radius: 14px; overflow: hidden; border: 1px solid #232633; cursor: pointer; display: flex; flex-direction: column; position: relative; }
    
    .thumb-wrapper { position: relative; width: 100%; padding-top: 100%; background: #232633; }
    .thumb-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    
    /* Lock Badge on Thumbnail */
    .lock-icon { position: absolute; top: 8px; right: 8px; background: #e53e3e; color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .unlocked-badge { position: absolute; top: 8px; right: 8px; background: #28a745; color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; display: none; }

    .card-info { padding: 10px; }
    .card-title { font-size: 13px; font-weight: 600; color: #e2e8f0; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .card-stats { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #718096; }
    .ad-badge { background: #252836; padding: 2px 6px; border-radius: 4px; border: 1px solid #32374a; color: #a0aec0; }

    /* Unlocked Content Drawer */
    .unlocked-content { display: none; grid-column: 1 / -1; background: #181a20; border: 1px solid #6c5ce7; border-radius: 12px; padding: 12px; margin-top: 5px; }
    .video-item { background: #232633; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
    .video-item a { color: #fff; text-decoration: none; font-weight: bold; background: #28a745; padding: 4px 10px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <div class="brand"><span>▶</span> VideoBot</div>
    <div class="user-avatar"></div>
  </div>

  <!-- Search Input -->
  <div class="search-box">
    <span>🔍</span>
    <input type="text" placeholder="Search videos...">
  </div>

  <!-- Category Pills -->
  <div class="categories">
    <button class="cat-btn active">🔥 All</button>
    <button class="cat-btn">Blogger Video</button>
    <button class="cat-btn">Desi new Video</button>
    <button class="cat-btn">Terabox</button>
  </div>

  <div class="section-label">🕒 Newest Videos</div>

  <!-- 2-Column Grid -->
  <div class="video-grid">
    
    <!-- CARD 1 -->
    <div class="video-card" onclick="watchAd('1')">
      <div class="thumb-wrapper">
        <!-- Apnar Thumbnail Link Ekhane Diben -->
        <img src="https://picsum.photos/300/300?random=1" alt="Thumb 1">
        <div id="lock-1" class="lock-icon">🔒</div>
        <div id="unlock-1" class="unlocked-badge">✓</div>
      </div>
      <div class="card-info">
        <div class="card-title">Course Part 1 Bundle</div>
        <div class="card-stats">
          <span>👁 799</span>
          <span id="badge-1" class="ad-badge">📺 0/2</span>
        </div>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="video-card" onclick="watchAd('2')">
      <div class="thumb-wrapper">
        <!-- Apnar Thumbnail Link Ekhane Diben -->
        <img src="https://picsum.photos/300/300?random=2" alt="Thumb 2">
        <div id="lock-2" class="lock-icon">🔒</div>
        <div id="unlock-2" class="unlocked-badge">✓</div>
      </div>
      <div class="card-info">
        <div class="card-title">Course Part 2 Bundle</div>
        <div class="card-stats">
          <span>👁 639</span>
          <span id="badge-2" class="ad-badge">📺 0/2</span>
        </div>
      </div>
    </div>

    <!-- Content Area for Video 1 -->
    <div id="content-1" class="unlocked-content">
      <div style="font-size:12px; color:#aaa; margin-bottom:8px;">📺 PART 1 VIDEOS:</div>
      <div class="video-item">
        <span>🎬 Video 1.1 Intro</span>
        <a href="javascript:void(0)" onclick="openLink('https://t.me/Deshi_Hub69/22')">Watch</a>
      </div>
      <div class="video-item">
        <span>🎬 Video 1.2 Main Class</span>
        <a href="javascript:void(0)" onclick="openLink('https://t.me/Deshi_Hub69/21')">Watch</a>
      </div>
    </div>

    <!-- Content Area for Video 2 -->
    <div id="content-2" class="unlocked-content">
      <div style="font-size:12px; color:#aaa; margin-bottom:8px;">📺 PART 2 VIDEOS:</div>
      <div class="video-item">
        <span>🎬 Video 2.1 Advanced Setup</span>
        <a href="javascript:void(0)" onclick="openLink('https://streamable.com/uc30ye')">Watch</a>
      </div>
      <div class="video-item">
        <span>🎬 Video 2.2 Final Guide</span>
        <a href="javascript:void(0)" onclick="openLink('https://t.me/your_channel/4')">Watch</a>
      </div>
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const MONETAG_DIRECT_LINK = "https://uplcm.com/4/11971532";

    const adProgress = {
      '1': 0,
      '2': 0
    };

    const REQUIRED_ADS = 2;

    function watchAd(cardId) {
      if (adProgress[cardId] >= REQUIRED_ADS) return;

      // Open Monetag Ad Link
      tg.openLink(MONETAG_DIRECT_LINK);

      adProgress[cardId]++;
      
      const badge = document.getElementById(`badge-${cardId}`);
      badge.innerText = `📺 ${adProgress[cardId]}/${REQUIRED_ADS}`;

      if (adProgress[cardId] >= REQUIRED_ADS) {
        document.getElementById(`lock-${cardId}`).style.display = 'none';
        document.getElementById(`unlock-${cardId}`).style.display = 'flex';
        document.getElementById(`content-${cardId}`).style.display = 'block';
      }
    }

    function openLink(url) {
      tg.openLink(url);
    }
  </script>
</body>
</html>
