<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeshiHub69 - Video Hub</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; margin: 0; padding: 15px; }
    h2 { text-align: center; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #333; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
    .card h3 { margin: 10px 0 5px 0; font-size: 18px; }
    .btn { background: #e50914; color: white; border: none; padding: 10px 15px; margin-top: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold; }
    .btn.unlocked { background: #28a745; }
  </style>
</head>
<body>

  <h2>Exclusive Videos</h2>

  <div class="grid">
    <!-- Video 1 -->
    <div class="card">
      <img src="https://picsum.photos/300/180?random=1" alt="Thumbnail">
      <h3>Video 1: First Video Title</h3>
      <button id="btn-1" class="btn" onclick="handleWatch('1', 'https://www.youtube.com')">
        🔒 Watch Ad to Unlock (0/2)
      </button>
    </div>

    <!-- Video 2 -->
    <div class="card">
      <img src="https://picsum.photos/300/180?random=2" alt="Thumbnail">
      <h3>Video 2: Second Video Title</h3>
      <button id="btn-2" class="btn" onclick="handleWatch('2', 'https://www.youtube.com')">
        🔒 Watch Ad to Unlock (0/2)
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Adsgram Controller Initialization
    const AdController = window.Adsgram.init({ blockId: "52332" });

    // Track ad views count for each video
    const adProgress = {
      '1': 0,
      '2': 0
    };

    const REQUIRED_ADS = 2;

    function handleWatch(videoId, videoUrl) {
      if (adProgress[videoId] >= REQUIRED_ADS) {
        tg.openLink(videoUrl);
        return;
      }

      // Show Adsgram Rewarded Video
      AdController.show().then((result) => {
        adProgress[videoId]++;
        const btn = document.getElementById(`btn-${videoId}`);

        if (adProgress[videoId] >= REQUIRED_ADS) {
          btn.innerText = "▶ Watch Video Now";
          btn.classList.add("unlocked");
          tg.openLink(videoUrl);
        } else {
          btn.innerText = `🔒 Watch Ad (${adProgress[videoId]}/${REQUIRED_ADS})`;
        }
      }).catch((result) => {
        alert("অ্যাড দেখা কমপ্লিট হয়নি! ভিডিও আনলক করতে অ্যাডটি পুরো দেখুন");
      });
    }
  </script>
</body>
</html>
